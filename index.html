<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EN.AR Staff Directory</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="login-page">
        <section class="login-container">
            <!-- Login Form -->
            <div class="login-form-section">

                <div class="logo">
                    <!-- <span>👥</span> -->
                    <h1>EN.AR</h1>
                </div>

                <p class="system-name">
                    Staff Directory & Records
                    Management System
                </p>

                <div class="welcome-text">
                    <h2>Welcome Back!</h2>
                    <p>Please sign in to your account</p>
                </div>

                <form id="loginForm">

                    <div class="form-group">
                        <label for="email">Email</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="admin@enar.com"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <div class="login-options">

                        <label class="remember-me">
                            <input type="checkbox">
                            Remember me
                        </label>

                        <a href="#">Forgot password?</a>

                    </div>

                    <button type="submit" class="login-button">
                        Login
                    </button>

                </form>

                <p class="copyright">
                    © 2026 EN.AR Limited. All rights reserved.
                </p>

            </div>


            <!-- Image / Illustration Section -->
            <div class="login-image-section">

                <div class="building-background">
                    <!-- <img src="..assets/images/images2.jpg" alt="working"> -->
                    <!-- 🏢 -->
                </div>

                <div class="people-illustration">
                    <!-- 👩🏽‍💼 👨🏽‍💼 <img src="images2.jpg " alt="working"> -->
                </div>

            </div>

        </section>

    </main>


    <script src="js/auth.js"></script>

</body>
</html>
